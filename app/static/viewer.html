<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3.5 1h6l3.5 3.5V15h-9.5z' fill='%232f6fde'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/vendor/hljs-github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/static/vendor/hljs-github-dark.min.css" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="sidebar-toggle" data-icon="panel" aria-label="Toggle sidebar" title="Show / hide sidebar"></button>
    <a href="/" class="brand" id="brand">Docs</a>
    <div class="spacer"></div>
    <input class="search" id="search" type="search" placeholder="Search docs…" autocomplete="off">
    <a class="btn" href="/admin/" title="Admin panel (login required)">Admin</a>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main">
      <div class="home" id="home" hidden></div>
      <article class="markdown" id="content"></article>
    </main>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/mermaid.min.js"></script>
  <script src="/static/common.js"></script>
  <script>
    const sidebar = document.getElementById('sidebar');
    const content = document.getElementById('content');
    const search = document.getElementById('search');
    let tree = [];
    let siteTitle = 'Docs';

    const home = document.getElementById('home');
    // '' means the home page.
    const currentPath = () => decodeURIComponent(location.pathname.replace(/^\/docs\/?/, '').replace(/^\/$/, ''));
    const docHref = p => '/docs/' + p.split('/').map(encodeURIComponent).join('/');

    const countDocs = items => items.reduce((n, it) => n + (it.type === 'doc' ? 1 : countDocs(it.children)), 0);
    const allDocs = items => items.flatMap(it => it.type === 'doc' ? [it] : allDocs(it.children));

    function timeAgo(secs) {
      const d = Date.now() / 1000 - secs;
      if (d < 60) return 'just now';
      const units = [[86400 * 365, 'year'], [86400 * 30, 'month'], [86400 * 7, 'week'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
      const [size, name] = units.find(([s]) => d >= s);
      const n = Math.floor(d / size);
      return `${n} ${name}${n > 1 ? 's' : ''} ago`;
    }

    /** One card per top-level folder, plus one for docs that aren't in a folder. */
    function sectionCards() {
      const loose = tree.filter(it => it.type === 'doc');
      const groups = [
        ...(loose.length ? [{ name: 'General', docs: loose }] : []),
        ...tree.filter(it => it.type === 'folder' && hasDocs(it))
          .map(f => ({ name: prettyName(f.name), docs: allDocs(f.children), total: countDocs(f.children) })),
      ];
      return groups.map(g => {
        const shown = g.docs.slice(0, 5), more = g.docs.length - shown.length;
        return `<section class="home-card">
          <h3><a href="${escapeHtml(docHref(g.docs[0].path))}">${ICONS.folder}${escapeHtml(g.name)}</a>
            <span class="count">${g.docs.length}</span></h3>
          <ul>${shown.map(d => `<li><a href="${escapeHtml(docHref(d.path))}">${escapeHtml(d.title || prettyName(d.name))}</a></li>`).join('')}</ul>
          ${more ? `<div class="more-link">+ ${more} more in the sidebar</div>` : ''}
        </section>`;
      }).join('');
    }

    async function loadHome() {
      let h;
      try { h = await api('/api/home'); }
      catch { h = { heading: '', tagline: '', body: '', show_sections: true, show_recent: true, recent: [] }; }
      home.innerHTML = `<header class="home-hero">
          <h1>${escapeHtml(h.heading || siteTitle)}</h1>
          ${h.tagline ? `<p class="tagline">${escapeHtml(h.tagline)}</p>` : ''}
        </header>
        <div class="markdown home-body" id="home-body"></div>
        ${!tree.length ? `<div class="home-empty">No docs yet. Head to the <a href="/admin/">admin panel</a> to write your first one.</div>` : ''}
        ${tree.length && h.show_sections ? `<h2 class="home-label">Browse</h2><div class="home-grid">${sectionCards()}</div>` : ''}
        ${h.show_recent && h.recent.length ? `<h2 class="home-label">Recently updated</h2><ul class="home-recent">${h.recent.map(r => `<li>
            <a href="${escapeHtml(docHref(r.path))}">${ICONS.doc}<span class="label-text">${escapeHtml(r.title)}</span></a>
            <span class="where">${escapeHtml(r.path.includes('/') ? r.path.split('/').slice(0, -1).map(prettyName).join(' / ') : '')}</span>
            <time title="${escapeHtml(new Date(r.modified * 1000).toLocaleString())}">${timeAgo(r.modified)}</time>
          </li>`).join('')}</ul>` : ''}`;
      const body = document.getElementById('home-body');
      if (h.body.trim()) await renderMarkdown(h.body, body); else body.remove();
      document.title = siteTitle;
    }

    async function loadDoc(path, { push = false } = {}) {
      document.body.classList.remove('nav-open');
      if (push) history.pushState({}, '', docHref(path));
      home.hidden = !!path; content.hidden = !path;
      if (!path) {
        await loadHome();
        setActive(sidebar, null);
        document.getElementById('main').scrollTo(0, 0);
        return;
      }
      try {
        const doc = await api('/api/docs/' + path);
        await renderMarkdown(doc.content, content);
        document.title = `${doc.title} · ${siteTitle}`;
      } catch (e) {
        content.innerHTML = tree.length
          ? `<h1>Not found</h1><p>No doc at <code>${escapeHtml(path)}</code>.</p>`
          : `<h1>No docs yet</h1><p>Head to the <a href="/admin/">editor</a> to write your first one.</p>`;
        document.title = siteTitle;
      }
      setActive(sidebar, path);
      const hash = decodeURIComponent(location.hash.slice(1));
      const target = hash && document.getElementById(hash);
      target ? target.scrollIntoView() : document.getElementById('main').scrollTo(0, 0);
    }

    function showTree() {
      renderTree(sidebar, tree, { href: docHref, active: currentPath() });
      if (!tree.length) sidebar.innerHTML = '<div class="empty">No docs yet.</div>';
    }

    // In-app navigation for doc links (sidebar and links inside docs).
    document.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin || !url.pathname.startsWith('/docs/') && url.pathname !== '/') return;
      if (url.pathname === location.pathname && url.hash) return;
      e.preventDefault();
      history.pushState({}, '', url.pathname + url.hash);
      loadDoc(currentPath());
    });
    window.addEventListener('popstate', () => loadDoc(currentPath()));

    let searchTimer;
    search.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = search.value.trim();
        if (!q) return showTree();
        const results = await api('/api/search?q=' + encodeURIComponent(q));
        sidebar.innerHTML = results.length
          ? '<ul class="search-results">' + results.map(r =>
              `<li><a href="${docHref(r.path)}" data-path="${escapeHtml(r.path)}">${escapeHtml(r.title)}` +
              (r.snippet ? `<span class="snippet">${escapeHtml(r.snippet)}</span>` : '') + '</a></li>').join('') + '</ul>'
          : '<div class="empty">No matches.</div>';
        document.body.classList.add('nav-open');
      }, 200);
    });

    (async () => {
      try { siteTitle = (await api('/api/config')).title; } catch { }
      document.getElementById('brand').textContent = siteTitle;
      tree = await api('/api/tree');
      showTree();
      loadDoc(currentPath());
    })();
  </script>
</body>
</html>
