<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · easydocs</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .login-wrap { min-height: calc(100% - var(--topbar)); display: grid; place-items: center; padding: 24px 16px; }
    .login {
      width: 100%; max-width: 340px; padding: 24px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg-soft);
    }
    .login h1 { font-size: 19px; margin: 0 0 4px; }
    .login p { margin: 0 0 18px; color: var(--text-soft); font-size: 14px; }
    .login label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .login input {
      width: 100%; height: 36px; padding: 0 10px; margin-bottom: 14px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg-elv); color: var(--text); font: inherit;
    }
    .login input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .login button { width: 100%; justify-content: center; height: 36px; }
    .login .error { color: var(--danger); font-size: 13px; margin: -4px 0 14px; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">easydocs</span>
  </header>
  <div class="login-wrap">
    <form class="login" id="login">
      <h1>Sign in</h1>
      <p>This site needs the admin password.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <div class="error" id="error" hidden></div>
      <button class="primary" type="submit" id="submit">Sign in</button>
    </form>
  </div>
  <script src="/static/config.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    // Only ever send people on to a page of this site, never off-site.
    const next = new URLSearchParams(location.search).get('next') || '/';
    const safeNext = /^\/(?![/\\])/.test(next) && !next.startsWith('/admin/login') ? next : '/';
    const form = document.getElementById('login'), error = document.getElementById('error');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      form.submit.disabled = true;
      const problem = await auth.signIn(form.password.value);
      form.submit.disabled = false;
      if (!problem) return location.replace(safeNext);
      error.textContent = problem; error.hidden = false;
      form.password.select();
    });
  </script>
</body>
</html>
