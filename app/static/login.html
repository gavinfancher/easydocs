<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Docs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3.5 1h6l3.5 3.5V15h-9.5z' fill='%232f6fde'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-soft); padding: 16px; }
    .card { width: 100%; max-width: 360px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--text-soft); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { width: 100%; height: 38px; justify-content: center; margin-top: 20px; }
    .error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 1.2em; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1 id="title">Docs admin</h1>
    <p class="sub">Log in to create and edit docs.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" value="admin" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button class="primary" id="submit">Log in</button>
    <div class="error" id="error"></div>
    <a class="back" href="/">Back to docs</a>
  </form>
  <script>
    const form = document.getElementById('form'), err = document.getElementById('error'), btn = document.getElementById('submit');
    fetch('/api/config').then(r => r.json()).then(c => { document.getElementById('title').textContent = c.title + ' admin'; }).catch(() => { });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.textContent = ''; btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const res = await fetch('/admin/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        if (!res.ok) throw new Error((await res.json()).detail || 'Login failed');
        const next = new URLSearchParams(location.search).get('next');
        location.href = (next && /^\/admin\/[\w-]*$/.test(next) ? next : '/admin/') + location.hash;  // back where you were
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false; btn.textContent = 'Log in';
        form.password.select();
      }
    });
  </script>
</body>
</html>
