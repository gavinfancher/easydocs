<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor · Docs</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/vendor/hljs-github-dark.min.css">
  <style>
    .editor-wrap { display: flex; flex-direction: column; height: 100%; }
    .doc-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .doc-path { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--text-soft); flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { font-size: 13px; color: var(--text-soft); min-width: 60px; text-align: right; }
    .status.dirty { color: var(--warn); }
    .status.error { color: var(--danger); }
    .tools { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
    .tools button { height: 28px; font-size: 13px; padding: 0 9px; }
    .tools .sep { width: 1px; background: var(--border); margin: 2px 4px; }
    .panes { flex: 1; display: flex; min-height: 0; }
    .statusbar { display: flex; gap: 16px; padding: 4px 12px; border-top: 1px solid var(--border); background: var(--bg-soft); font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-faint); white-space: nowrap; }
    .statusbar > span { overflow: hidden; text-overflow: ellipsis; }
    .statusbar > span:first-child { flex: 1; min-width: 0; }
    .panes > * { flex: 1; min-width: 0; overflow-y: auto; }
    #editor {
      border: none; resize: none; outline: none; padding: 24px 28px 80px;
      background: var(--bg); color: var(--text);
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2;
    }
    #preview-pane { border-left: 1px solid var(--border); position: relative; }
    #preview img { cursor: context-menu; }
    .img-tools { position: absolute; pointer-events: none; outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); z-index: 5; }
    .img-badge {
      position: absolute; left: 0; bottom: 100%; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
      padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
      box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 12px; color: var(--text-soft); white-space: nowrap;
    }
    .img-badge b { color: var(--accent); }
    .img-handle {
      position: absolute; right: -8px; width: 16px; height: 16px; pointer-events: auto;
      background: var(--accent); border: 2px solid var(--bg); border-radius: 50%; touch-action: none;
    }
    .img-handle.br { bottom: -8px; cursor: nwse-resize; }
    .img-handle.tr { top: -8px; cursor: nesw-resize; }
    .img-tools.dragging { outline-style: dashed; }
    #preview-pane .markdown { padding: 24px 32px 80px; }
    body.drag-over #editor { outline: 3px dashed var(--accent); outline-offset: -10px; }
    .placeholder { margin: auto; text-align: center; color: var(--text-soft); padding: 40px; }
    .placeholder h2 { color: var(--text); font-weight: 600; }
    body.preview-hidden #preview-pane { display: none; }
    body.editor-hidden #editor { display: none; }
    @media (max-width: 800px) {
      body:not(.editor-hidden) #preview-pane { display: none; }
      #preview-pane { border-left: none; }
      #editor { padding: 16px; }
    }

    .sidebar-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px 8px; }
    .sidebar-head span { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-soft); }
    .sidebar-head button { height: 28px; font-size: 13px; padding: 0 9px; }
    /* Let the tree fill the sidebar so right-click and drop work on the empty space below it. */
    .sidebar { display: flex; flex-direction: column; }
    #tree { flex: 1; border-radius: var(--radius); }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="sidebar-toggle" data-icon="panel" aria-label="Toggle sidebar" title="Show / hide sidebar"></button>
    <a href="/admin/edit" class="brand" id="brand">Docs <small>editor</small></a>
    <div class="spacer"></div>
    <a class="btn" href="/admin/" data-icon="back">Admin panel</a>
    <a class="btn hide-mobile" href="/" target="_blank" data-icon="external">View site</a>
  </header>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-head">
        <span>Docs</span>
        <button id="new-doc" data-icon="plus" title="New doc or folder">New</button>
      </div>
      <div id="tree" class="tree"></div>
    </nav>
    <main class="main" id="main">
      <div class="editor-wrap" id="workspace" hidden>
        <div class="doc-bar">
          <span class="doc-path" id="doc-path"></span>
          <span class="status" id="status"></span>
          <button id="toggle-preview" data-icon="eye" title="Show / hide preview">Preview</button>
          <a class="btn" id="view-link" target="_blank" data-icon="external" title="Open on site">View</a>
          <button id="doc-more" class="icon-btn" title="More actions" aria-label="More actions"></button>
          <button id="save" class="primary" title="Save (⌘/Ctrl+S)">Save</button>
        </div>
        <div class="tools">
          <button id="link-btn" data-icon="link" title="Insert a link (⌘K)">Link</button>
          <button id="code-btn" data-icon="code" title="Code block (⌘⇧E)">Code</button>
          <button id="image-btn" data-icon="image" title="Upload an image or file. You can also paste or drag one in.">Image</button>
          <button id="library-btn" data-icon="library" title="Insert something you've already uploaded">From uploads</button>
          <input type="file" id="file-input" multiple hidden>
        </div>
        <div class="panes">
          <textarea id="editor" spellcheck="true" placeholder="Start writing… Paste or drop images right here."></textarea>
          <div id="preview-pane"><article class="markdown" id="preview"></article></div>
        </div>
        <div class="statusbar" aria-live="off">
          <span id="sb-doc"></span><span id="sb-pos"></span><span id="sb-words"></span>
        </div>
      </div>
      <div class="placeholder" id="empty-state">
        <h2>Pick a doc to edit</h2>
        <p>Choose one from the sidebar, or click <b>New</b> to start one.</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="library" hidden>
    <div class="modal" role="dialog" aria-label="Uploads">
      <div class="modal-head">
        <h2>Insert from uploads</h2>
        <input class="search" id="lib-search" type="search" placeholder="Filter by name…" autocomplete="off">
        <div class="spacer"></div>
        <button id="lib-upload" data-icon="upload">Upload</button>
        <button id="lib-close" class="icon-btn" data-icon="x" aria-label="Close"></button>
        <input type="file" id="lib-file-input" multiple hidden>
      </div>
      <div class="modal-hint">Click an item to insert it at your cursor. Drop files here to upload them into the open folder.</div>
      <div class="lib-body">
        <nav class="lib-folders" id="lib-folders" aria-label="Upload folders"></nav>
        <div class="lib-grid" id="lib-grid"></div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/mermaid.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/admin.js"></script>
  <script>
    const editor = $('editor'), preview = $('preview'), statusEl = $('status');
    let current = null;       // path of the open doc
    let savedContent = '';

    $('doc-more').innerHTML = ICONS.dots;

    const isDirty = () => current && editor.value !== savedContent;
    function setStatus(text, cls = '') { statusEl.textContent = text; statusEl.className = 'status ' + cls; }
    function updateDirty() { isDirty() ? setStatus('Unsaved', 'dirty') : setStatus('Saved'); updateStatusbar(); }
    const confirmDiscard = async () => !isDirty() || askConfirm('Discard unsaved changes?',
      `Your edits to "${current}" haven't been saved.`, { okLabel: 'Discard', danger: true });

    // The open doc lives in the URL: /admin/edit/guides/setup
    const pathFromUrl = () => {
      const p = location.pathname.replace(/^\/admin\/edit\/?/, '');
      try { return decodeURIComponent(p.replace(/\/$/, '')); } catch { return p; }
    };
    function showPath({ push = false } = {}) {
      $('doc-path').textContent = current;
      $('view-link').href = '/docs/' + current;
      if (location.pathname !== editorUrl(current)) history[push ? 'pushState' : 'replaceState'](null, '', editorUrl(current));
    }
    function closeDoc() {
      current = null; savedContent = '';
      $('workspace').hidden = true; $('empty-state').hidden = false;
      history.replaceState(null, '', '/admin/edit');
    }

    /** Open a doc from a click in the page (no reload), asking first if there are unsaved edits. */
    async function navigate(path) {
      if (path === current) return;
      if (!await confirmDiscard()) return;
      savedContent = editor.value;  // discarding: don't ask again
      await openDoc(path, { push: true });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="/admin/edit/"]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0 || a.target === '_blank') return;
      e.preventDefault();
      navigate(decodeURIComponent(new URL(a.href).pathname.replace(/^\/admin\/edit\//, '')));
    });

    // ---------- tree (shared logic in admin.js) ----------
    Object.assign(docHooks, {
      active: () => current,
      href: editorUrl,
      open: path => navigate(path),
      defaultFolder: () => current ? parentOf(current) : '',
      beforeChange: async path => {
        if (isDirty() && (current === path || current.startsWith(path + '/'))) await save();
      },
      afterMove: (src, dst) => {
        if (!current) return;
        if (current === src) current = dst;
        else if (current.startsWith(src + '/')) current = dst + current.slice(src.length);
        else return;
        showPath();
      },
      afterDelete: path => { if (current === path) closeDoc(); },
      afterCreate: async path => {
        if (!await confirmDiscard()) return;
        current = null;
        await openDoc(path, { push: true });
        editor.setSelectionRange(editor.value.length, editor.value.length);
      },
      openContent: path => path === current ? editor.value : undefined,
      contentReplaced: (path, content) => {
        if (path !== current) return;
        editor.value = savedContent = content; updateDirty(); schedulePreview(0);
      },
    });
    setupTree($('tree'));
    $('new-doc').onclick = e => newMenu(e.currentTarget);

    // ---------- open / save ----------
    async function openDoc(path, { push = false } = {}) {
      if (path === current) return;
      try {
        const doc = await api('/api/docs/' + path);
        imgTools.clear();
        current = doc.path; savedContent = doc.content; editor.value = doc.content;
        $('workspace').hidden = false; $('empty-state').hidden = true;
        showPath({ push });
        document.title = `${doc.title} · Editor`;
        setActive($('tree'), current);
        updateDirty(); schedulePreview(0);
        editor.focus(); editor.setSelectionRange(0, 0); editor.scrollTop = 0;
        document.body.classList.remove('nav-open');
      } catch (err) { toast(err.message); }
    }

    async function save() {
      if (!current) return;
      const content = editor.value;
      setStatus('Saving…');
      try {
        const res = await api('/admin/api/docs/' + current, jsonOpts('PUT', { content }));
        savedContent = content; updateDirty();
        document.title = `${res.title} · Editor`;
        const label = $('tree').querySelector(`.row[data-path="${CSS.escape(current)}"] .label-text`);
        if (label) label.textContent = res.title;
      } catch (err) { setStatus('Save failed', 'error'); toast(err.message); }
    }

    $('save').onclick = save;
    $('doc-more').onclick = e => showMenu(e.currentTarget, [
      { label: 'Copy link', icon: 'link', action: () => copyLink(current) },
      { label: 'Rename…', icon: 'edit', action: () => renameDoc(current) },
      { label: 'Move to…', icon: 'move', action: () => moveDialog(current, 'doc') },
      'sep',
      { label: 'Delete', icon: 'trash', danger: true, action: () => deleteDoc(current) },
    ]);
    $('toggle-preview').onclick = () => {
      if (window.innerWidth <= 800) document.body.classList.toggle('editor-hidden');
      else document.body.classList.toggle('preview-hidden');
    };

    // Back / forward buttons.
    window.addEventListener('popstate', async () => {
      const p = pathFromUrl();
      if (p === current) return;
      if (!await confirmDiscard()) { history.pushState(null, '', current ? editorUrl(current) : '/admin/edit'); return; }
      savedContent = editor.value;
      p ? openDoc(p) : closeDoc();
    });
    window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

    // ---------- live preview ----------
    let previewTimer;
    function schedulePreview(ms = 250) {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(async () => { await renderMarkdown(editor.value, preview); imgTools.refresh(); }, ms);
    }

    // ---------- resize images: right-click one in the preview ----------
    // The size is stored in the markdown as ![alt|50%](url), so it shows the same on the site.
    const imgTools = (() => {
      const pane = $('preview-pane');
      const box = document.createElement('div');
      box.className = 'img-tools'; box.hidden = true;
      box.innerHTML = `<div class="img-badge"><b class="img-size"></b><span>Drag a corner · Esc when done</span></div>
        <div class="img-handle tr" title="Drag to resize"></div>
        <div class="img-handle br" title="Drag to resize"></div>`;
      pane.append(box);
      let sel = null;  // drag mode: { src, k } = the k-th image in the doc with this src

      const imgs = () => [...preview.querySelectorAll('img')];
      const keyOf = img => {
        const src = img.getAttribute('src');
        return { src, k: imgs().filter(i => i.getAttribute('src') === src).indexOf(img) };
      };
      const current = () => sel && imgs().filter(i => i.getAttribute('src') === sel.src)[sel.k];

      function place() {
        const img = current();
        if (!img) { box.hidden = true; return; }
        const p = pane.getBoundingClientRect(), r = img.getBoundingClientRect(), z = uiZoom();
        Object.assign(box.style, {
          left: (r.left - p.left) / z + pane.scrollLeft + 'px', top: (r.top - p.top) / z + pane.scrollTop + 'px',
          width: r.width / z + 'px', height: r.height / z + 'px',
        });
        box.querySelector('.img-size').textContent = img.style.width || 'Full size';
        box.hidden = false;
      }
      function startDrag(img) {
        sel = keyOf(img);
        if (!img.complete) img.addEventListener('load', place, { once: true });
        place();
      }
      function clear() { sel = null; box.hidden = true; }

      /** Rewrite the size in the markdown for one image (keeps undo working). */
      function apply(key, width) {
        const re = /!\[((?:\\.|[^\]\\])*)\]\(\s*<?([^\s)>]+)>?(?:\s+"[^"]*")?\s*\)/g;
        const hits = [...editor.value.matchAll(re)].filter(m => {
          try { return m[2] === key.src || encodeURI(m[2]).replace(/%25/g, '%') === key.src; } catch { return false; }
        });
        const m = hits[key.k];
        if (!m) { toast('Couldn’t find that image in the markdown. Add |50% to its alt text by hand.'); return; }
        const alt = splitImageSize(m[1]).alt + (width ? '|' + width : '');
        const start = m.index + 2;
        const { scrollTop } = editor;
        editor.setSelectionRange(start, start + m[1].length);
        insertText(alt);
        editor.scrollTop = scrollTop;
      }

      // Right-click an image for sizes; Shift+right-click still gets the browser's menu.
      preview.addEventListener('contextmenu', e => {
        const img = e.target.closest('img');
        if (!img || e.shiftKey) return;
        e.preventDefault();
        const key = keyOf(img), w = img.style.width;
        const size = (label, width) => ({
          label, icon: w === width ? 'check' : null,
          action: () => { img.style.width = width; apply(key, width); },
        });
        const url = new URL(img.getAttribute('src'), location.href).href;
        showMenu(img, [
          size('Small (25%)', '25%'), size('Medium (50%)', '50%'), size('Large (75%)', '75%'), size('Full size', ''),
          { label: 'Custom size…', icon: 'move', hint: ['', '25%', '50%', '75%'].includes(w) ? 'Drag to resize' : `Now ${w}`,
            action: () => startDrag(img) },
          'sep',
          { label: 'Open image in new tab', icon: 'external', action: () => window.open(url, '_blank') },
          { label: 'Copy image link', icon: 'link', action: async () => {
              try { await navigator.clipboard.writeText(url); toast('Link copied'); }
              catch { await askText('Copy this link', url, { okLabel: 'Done' }); } } },
        ], e.clientX || e.clientY ? { x: e.clientX, y: e.clientY } : null);
      });

      // Drag either right-hand corner: snaps to 5% steps of the page width.
      box.querySelectorAll('.img-handle').forEach(h => h.addEventListener('pointerdown', e => {
        const img = current(); if (!img) return;
        e.preventDefault();
        const handle = e.currentTarget, startX = e.clientX, startW = img.getBoundingClientRect().width;
        const cs = getComputedStyle(preview);  // padding is in page pixels; the rects are zoomed
        const full = preview.getBoundingClientRect().width - (parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)) * uiZoom();
        let pct = null;
        handle.setPointerCapture(e.pointerId);
        box.classList.add('dragging');
        const move = ev => {
          pct = Math.max(10, Math.min(100, Math.round((startW + ev.clientX - startX) / full * 20) * 5));
          img.style.width = pct === 100 ? '' : pct + '%';
          place();
        };
        const up = () => {
          handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up);
          box.classList.remove('dragging');
          if (pct !== null) apply(sel, pct === 100 ? '' : pct + '%');
        };
        handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
      }));

      // Clicking anywhere else (or Esc) finishes resizing.
      document.addEventListener('mousedown', e => { if (sel && !box.contains(e.target)) clear(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') clear(); });
      window.addEventListener('resize', place);
      return { refresh: () => sel && place(), clear };
    })();
    editor.addEventListener('input', () => { updateDirty(); schedulePreview(); });

    // ---------- status bar ----------
    function updateStatusbar() {
      if (!current) return;
      const before = editor.value.slice(0, editor.selectionStart);
      const line = before.split('\n').length, col = before.length - before.lastIndexOf('\n');
      const words = (editor.value.match(/[\p{L}\p{N}'’_-]+/gu) || []).length;
      const sel = editor.selectionEnd - editor.selectionStart;
      $('sb-doc').textContent = (isDirty() ? '● ' : '') + current + '.md';
      $('sb-pos').textContent = `Ln ${line}, Col ${col}` + (sel ? ` (${sel} selected)` : '');
      $('sb-words').textContent = `${words.toLocaleString()} word${words === 1 ? '' : 's'}`;
    }
    ['input', 'keyup', 'click', 'select', 'focus'].forEach(ev => editor.addEventListener(ev, updateStatusbar));

    // ---------- text editing ----------
    function insertText(text) {
      editor.focus();
      // execCommand keeps the browser's undo history working; fall back if unsupported.
      if (!document.execCommand('insertText', false, text)) {
        editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, 'end');
        editor.dispatchEvent(new Event('input'));
      }
    }
    function wrap(marker, fallback = 'text') {
      const { selectionStart: s, selectionEnd: e } = editor;
      const sel = editor.value.slice(s, e) || fallback;
      insertText(marker + sel + marker);
      editor.setSelectionRange(s + marker.length, s + marker.length + sel.length);
    }
    async function insertLink() {
      const { selectionStart: s, selectionEnd: e } = editor;
      const label = editor.value.slice(s, e) || 'link text';
      const url = await askText('Link to a URL, or a doc like /docs/guides/setup', 'https://', { okLabel: 'Insert link' });
      if (!url) return;
      editor.setSelectionRange(s, e);
      insertText(`[${label}](${url})`);
    }
    $('link-btn').onclick = insertLink;
    $('code-btn').onclick = () => { editor.focus(); codeBlock(); };

    /** Images go on their own line so they don't run into the surrounding text. */
    function ownLine(md) {
      const before = editor.value.slice(0, editor.selectionStart);
      const after = editor.value.slice(editor.selectionEnd);
      const lead = !before || before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
      const trail = after.startsWith('\n\n') ? '' : after.startsWith('\n') ? '\n' : '\n\n';
      return lead + md + trail;
    }

    editor.addEventListener('keydown', e => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key === 'b') { e.preventDefault(); wrap('**'); }
      else if (mod && e.key === 'i') { e.preventDefault(); wrap('_'); }
      else if (mod && e.key === 'k') { e.preventDefault(); insertLink(); }
      else if (mod && !e.shiftKey && e.key === 'e') { e.preventDefault(); wrap('`', 'code'); }
      else if (mod && e.shiftKey && e.code === 'KeyE') { e.preventDefault(); codeBlock(); }
      else if (mod && e.shiftKey && e.code === 'KeyX') { e.preventDefault(); wrap('~~'); }
      else if (mod && e.altKey && /^Digit[0-3]$/.test(e.code)) { e.preventDefault(); setHeading(+e.code.slice(5)); }
      else if (mod && e.shiftKey && e.code === 'Digit8') { e.preventDefault(); bulletList(); }
      else if (mod && e.shiftKey && e.code === 'Digit7') { e.preventDefault(); numberedList(); }
      else if (mod && e.shiftKey && e.code === 'Digit9') { e.preventDefault(); checklist(); }
      else if (mod && e.shiftKey && e.code === 'Period') { e.preventDefault(); quote(); }
      else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertText('  '); }
    });
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
    });

    // ---------- uploads: paste, drag & drop, Image button ----------
    async function uploadFiles(files) {
      for (const file of files) {
        const token = `![Uploading ${file.name || 'image'}…]()`;
        insertText(ownLine(token));
        try {
          const res = await uploadFile(file);
          replaceToken(token, res.is_image ? `![${res.name}](${res.url})` : `[${res.name}](${res.url})`);
        } catch (err) {
          replaceToken(token, '');
          toast(`Upload failed: ${err.message}`);
        }
      }
    }
    function replaceToken(token, replacement) {
      const i = editor.value.indexOf(token);
      if (i === -1) return;
      const caret = editor.selectionStart;
      editor.setSelectionRange(i, i + token.length);
      if (replacement) insertText(replacement);
      else { editor.setRangeText('', i, i + token.length); editor.dispatchEvent(new Event('input')); }
      const pos = caret > i ? caret + replacement.length - token.length : caret;
      editor.setSelectionRange(pos, pos);
    }

    editor.addEventListener('paste', e => {
      const files = [...(e.clipboardData?.files || [])];
      if (files.length) { e.preventDefault(); uploadFiles(files); }
    });
    let dragDepth = 0;
    editor.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; document.body.classList.add('drag-over'); } });
    editor.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drag-over'); } });
    editor.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
    editor.addEventListener('drop', e => {
      dragDepth = 0; document.body.classList.remove('drag-over');
      const files = [...e.dataTransfer.files];
      if (!files.length) return;
      e.preventDefault();
      uploadFiles(files);
    });
    $('image-btn').onclick = () => $('file-input').click();
    $('file-input').onchange = e => { uploadFiles([...e.target.files]); e.target.value = ''; };

    // ---------- "From uploads" picker ----------
    const library = createLibrary({
      grid: $('lib-grid'), search: $('lib-search'), folderNav: $('lib-folders'), dropZone: document.querySelector('#library .modal'),
      docLink: editorUrl,
      onInsert: item => { closeLibrary(); insertText(item.is_image ? ownLine(markdownFor(item)) : markdownFor(item)); toast('Inserted ' + displayName(item.name)); },
      // The server already rewrote saved docs; mirror that in the open (maybe unsaved) text.
      onRename: (oldUrl, newUrl, res) => {
        if (!current) return;
        const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const altRe = new RegExp(`(\\[)${esc(res.old_stem)}((?:\\s*\\|[^\\]]*)?\\]\\(${esc(oldUrl)}\\))`, 'g');
        const swap = t => t.replace(altRe, `$1${res.new_stem}$2`).split(oldUrl).join(newUrl);
        const dirty = editor.value !== savedContent;
        savedContent = swap(savedContent);
        if (editor.value.includes(oldUrl)) { editor.value = swap(editor.value); schedulePreview(0); }
        if (!dirty) savedContent = editor.value;
        updateDirty();
      },
    });
    async function openLibrary() {
      $('library').hidden = false; $('lib-search').value = ''; $('lib-search').focus();
      await library.load();
    }
    function closeLibrary() { $('library').hidden = true; if (current) editor.focus(); }
    $('library-btn').onclick = openLibrary;
    $('lib-close').onclick = closeLibrary;
    $('library').addEventListener('click', e => { if (e.target.id === 'library' || e.target.closest('.lib-used a')) closeLibrary(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('library').hidden && !document.querySelector('dialog[open], .popup-menu')) closeLibrary(); });
    $('lib-upload').onclick = () => $('lib-file-input').click();
    $('lib-file-input').onchange = e => { library.upload([...e.target.files]); e.target.value = ''; };

    // ---------- right-click menu in the text ----------
    /** Apply fn(lines) to every line the selection touches, then select the result. */
    function editLines(fn) {
      const v = editor.value, s0 = editor.selectionStart;
      let e0 = editor.selectionEnd;
      if (e0 > s0 && v[e0 - 1] === '\n') e0--;  // a selection ending at a line break doesn't include the next line
      const start = v.lastIndexOf('\n', s0 - 1) + 1;
      let end = v.indexOf('\n', e0);
      if (end === -1) end = v.length;
      const out = fn(v.slice(start, end).split('\n')).join('\n');
      editor.setSelectionRange(start, end);
      insertText(out);
      editor.setSelectionRange(start, start + out.length);
    }
    const setHeading = n => editLines(ls => ls.map(l => (n ? '#'.repeat(n) + ' ' : '') + l.replace(/^#{1,6}\s+/, '')));
    // Lists and quotes toggle: applied to lines that all have it already, it comes off.
    const MARK = /^([-*+]\s+\[[ xX]\]\s+|[-*+]\s+|\d+[.)]\s+|>\s?)/;
    function togglePrefix(re, make) {
      editLines(ls => {
        const content = ls.filter(l => l.trim());
        const all = content.length > 0 && content.every(l => re.test(l.trimStart()));
        let n = 0;
        return ls.map(l => {
          if (!l.trim()) return l;
          const indent = l.match(/^\s*/)[0], body = l.slice(indent.length);
          return indent + (all ? body.replace(re, '') : make(++n) + body.replace(MARK, ''));
        });
      });
    }
    const bulletList = () => togglePrefix(/^[-*+]\s+(?!\[[ xX]\])/, () => '- ');
    const numberedList = () => togglePrefix(/^\d+[.)]\s+/, n => n + '. ');
    const checklist = () => togglePrefix(/^[-*+]\s+\[[ xX]\]\s+/, () => '- [ ] ');
    const quote = () => togglePrefix(/^>\s?/, () => '> ');
    function codeBlock() {
      const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
      insertText(ownLine('```\n' + (sel || 'code') + '\n```'));
    }
    const TABLE = '| Column | Column |\n| ------ | ------ |\n|        |        |';
    const MERMAID = '```mermaid\nflowchart LR\n    A[Start] --> B[Finish]\n```';

    function clip(cmd) {
      editor.focus();
      if (!document.execCommand(cmd)) toast(`Use ${kbd(cmd === 'cut' ? 'Mod+X' : 'Mod+C')} instead`);
    }
    async function paste() {
      editor.focus();
      try {
        // Images on the clipboard get uploaded, like pasting with the keyboard.
        if (navigator.clipboard?.read) {
          const files = [];
          for (const it of await navigator.clipboard.read()) {
            const type = it.types.find(t => t.startsWith('image/'));
            if (type) files.push(new File([await it.getType(type)], 'pasted.' + type.split('/')[1].split('+')[0], { type }));
          }
          if (files.length) return uploadFiles(files);
        }
        const text = await navigator.clipboard.readText();
        if (text) insertText(text);
      } catch { toast(`The browser blocked that. Use ${kbd('Mod+V')} to paste.`); }
    }

    editor.addEventListener('contextmenu', e => {
      if (e.shiftKey) return;  // Shift+right-click: the browser's own menu (spelling suggestions)
      e.preventDefault();
      const has = editor.selectionEnd > editor.selectionStart;
      showMenu(editor, [
        { label: 'Cut', icon: 'cut', shortcut: 'Mod+X', disabled: !has, action: () => clip('cut') },
        { label: 'Copy', icon: 'copy', shortcut: 'Mod+C', disabled: !has, action: () => clip('copy') },
        { label: 'Paste', icon: 'paste', shortcut: 'Mod+V', action: paste },
        'sep',
        { label: 'Format', icon: 'bold', submenu: [
          { label: 'Bold', icon: 'bold', shortcut: 'Mod+B', action: () => wrap('**') },
          { label: 'Italic', icon: 'italic', shortcut: 'Mod+I', action: () => wrap('_') },
          { label: 'Strikethrough', icon: 'strike', shortcut: 'Mod+Shift+X', action: () => wrap('~~') },
          { label: 'Inline code', icon: 'code', shortcut: 'Mod+E', action: () => wrap('`', 'code') },
          'sep',
          { label: 'Heading 1', icon: 'heading', shortcut: 'Mod+Alt+1', action: () => setHeading(1) },
          { label: 'Heading 2', icon: 'heading', shortcut: 'Mod+Alt+2', action: () => setHeading(2) },
          { label: 'Heading 3', icon: 'heading', shortcut: 'Mod+Alt+3', action: () => setHeading(3) },
          { label: 'Normal text', shortcut: 'Mod+Alt+0', action: () => setHeading(0) },
        ] },
        { label: 'Paragraph', icon: 'list', submenu: [
          { label: 'Bulleted list', icon: 'list', shortcut: 'Mod+Shift+8', action: bulletList },
          { label: 'Numbered list', icon: 'list', shortcut: 'Mod+Shift+7', action: numberedList },
          { label: 'Checklist', icon: 'checklist', shortcut: 'Mod+Shift+9', action: checklist },
          { label: 'Quote', icon: 'quote', shortcut: 'Mod+Shift+.', action: quote },
          { label: 'Code block', icon: 'code', shortcut: 'Mod+Shift+E', action: codeBlock },
        ] },
        { label: 'Insert', icon: 'plus', submenu: [
          { label: 'Link…', icon: 'link', shortcut: 'Mod+K', action: insertLink },
          { label: 'Image or file…', icon: 'image', action: () => $('file-input').click() },
          { label: 'From uploads…', icon: 'library', action: openLibrary },
          'sep',
          { label: 'Table', icon: 'table', action: () => insertText(ownLine(TABLE)) },
          { label: 'Divider', icon: 'minus', action: () => insertText(ownLine('---')) },
          { label: 'Mermaid diagram', icon: 'diagram', action: () => insertText(ownLine(MERMAID)) },
        ] },
        'sep',
        { label: 'Select all', icon: 'selectAll', shortcut: 'Mod+A', action: () => { editor.focus(); editor.select(); } },
      ], e.clientX || e.clientY ? { x: e.clientX, y: e.clientY } : null);
    });

    // ---------- start ----------
    (async () => {
      try { $('brand').firstChild.textContent = (await api('/api/config')).title + ' '; } catch { }
      await refreshTree();
      const p = pathFromUrl();
      if (p) openDoc(p);
    })();
  </script>
</body>
</html>
