#cloud-config
# User data for the easydocs VM on Proxmox (see README: "Running it on the homelab").
hostname: easydocs
users:
  - name: ubuntu
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF1WilHLdRuxd4ZxJi1SKalgBgR7EaAHHaTDWgMxO+UH gavin@gavin-macbook-pro.localdomain
package_update: true
packages:
  - qemu-guest-agent
  - docker.io
  - docker-compose-v2
  - rsync
runcmd:
  - usermod -aG docker ubuntu
  - systemctl enable --now qemu-guest-agent docker
  - install -d -o ubuntu -g ubuntu /opt/easydocs
