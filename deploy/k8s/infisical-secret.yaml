# The `easydocs` Secret both pods read, kept in sync with Infisical by the
# Infisical operator (installed by the homek8s repo). This file holds no
# values: they live in Infisical, project easydocs, env prod, at the root.
# Edit one there and within a minute the operator updates the Secret and
# restarts the Deployments marked secrets.infisical.com/auto-reload.
#
# Keys: EASYDOCS_DATABASE_URL, EASYDOCS_ADMIN_PASSWORD_HASH, EASYDOCS_R2_ACCOUNT_ID,
# EASYDOCS_R2_BUCKET, EASYDOCS_R2_ACCESS_KEY_ID,
# EASYDOCS_R2_SECRET_ACCESS_KEY, TUNNEL_TOKEN.
#
#   kubectl -n easydocs describe infisicalsecret easydocs   # did it sync?
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: easydocs
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60 # seconds between checks for changed values
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: easydocs-hvgc
        envSlug: prod
        secretsPath: / # the whole project is easydocs'
      # A machine identity that's a Viewer on the easydocs project only. Its
      # client id/secret are made by hand, never in git:
      #   kubectl -n infisical-operator-system create secret generic infisical-easydocs-identity \
      #     --from-literal=clientId=... --from-literal=clientSecret=...
      credentialsRef:
        secretName: infisical-easydocs-identity
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: easydocs
      secretNamespace: easydocs
      creationPolicy: Owner # the operator owns the Secret; never create it by hand
