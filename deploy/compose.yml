# Production, on the easydocs VM (`make deploy` copies the repo to /opt/easydocs and runs this).
# The app talks to Postgres on postgres.ad.gavinf.com; cloudflared carries easydocs.gavinf.com to it,
# so nothing listens on the network. Secrets are in deploy/.env on the VM, never in git:
#
#   EASYDOCS_DATABASE_URL=postgresql://easydocs:<password>@postgres.ad.gavinf.com/easydocs
#   EASYDOCS_ADMIN_PASSWORD_HASH=scrypt:...      (uv run python -m app.auth)
#   TUNNEL_TOKEN=...                           (Cloudflare Zero Trust → Networks → Tunnels)
services:
  easydocs:
    build: ..
    restart: unless-stopped
    environment:
      EASYDOCS_TITLE: "easydocs"
      EASYDOCS_DATABASE_URL: ${EASYDOCS_DATABASE_URL:?}
      EASYDOCS_ADMIN_PASSWORD_HASH: ${EASYDOCS_ADMIN_PASSWORD_HASH:?}
    ports:
      - "127.0.0.1:8000:8000"   # for curl on the VM itself; the internet comes in via cloudflared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/config')"]
      interval: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run   # the tunnel's public hostname points at http://easydocs:8000
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on: [easydocs]
